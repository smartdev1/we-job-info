[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aristide Adouko", email = "aristide@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.21.0",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.148.0",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "openai>=1.0.0",
    "pillow>=13.0.0",
    "playwright>=1.64.0",
    "procrastinate>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
    "uvicorn>=0.54.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
